<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>علاء الدين 🪄 نظام الإدارة اليومية الذكي</title>
  <link rel="icon" type="image/jpeg" href="2.jpg">

  <!-- Google Fonts: Tajawal & Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tailwind CSS Configuration -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Tajawal', 'Cairo', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
              800: '#0c4a6e',
              900: '#0f172a',
            },
            accent: {
              500: '#f59e0b',
              600: '#d97706',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- SheetJS (xlsx) CDN for Excel exports -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Firebase Compat SDK v10.8.0 -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css?v=3.6">
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen selection:bg-brand-500 selection:text-white flex flex-col">

  <!-- Application Container -->
  <div id="app" class="flex flex-col min-h-screen">
    
    <!-- Login Screen Container -->
    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/90 backdrop-blur-md">
      <div class="w-full max-w-md p-8 bg-slate-900/90 rounded-2xl border border-slate-800 shadow-2xl relative overflow-hidden">
        <div class="absolute -top-10 -left-10 w-32 h-32 bg-brand-500/20 rounded-full blur-2xl"></div>
        <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-accent-500/20 rounded-full blur-2xl"></div>
        
        <div class="text-center mb-8 relative z-10">
          <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl overflow-hidden bg-slate-800/80 border border-brand-500/30 mb-4 shadow-lg shadow-brand-500/10">
            <img src="2.jpg" alt="علاء الدين 🪄" class="w-full h-full object-contain">
          </div>
          <h1 class="text-2xl font-bold text-white mb-2">علاء الدين 🪄</h1>
          <p class="text-sm text-slate-400">نظام الإدارة اليومية الذكي</p>
        </div>

        <form id="login-form" class="space-y-5 relative z-10">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-2">البريد الإلكتروني</label>
            <div class="relative">
              <input type="email" id="login-email" required value="" autocomplete="off" placeholder="name@store.com" class="w-full px-4 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 text-left transition-all">
              <i data-lucide="mail" class="w-5 h-5 text-slate-500 absolute left-3 top-3.5"></i>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-2">كلمة المرور</label>
            <div class="relative">
              <input type="password" id="login-password" required value="" autocomplete="new-password" placeholder="••••••••" class="w-full px-4 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 text-left transition-all">
              <i data-lucide="lock" class="w-5 h-5 text-slate-500 absolute left-3 top-3.5"></i>
            </div>
          </div>

          <button type="submit" id="btn-login-submit" class="w-full py-3.5 px-4 bg-gradient-to-r from-brand-600 to-brand-500 hover:from-brand-500 hover:to-brand-400 text-white font-bold rounded-xl shadow-lg shadow-brand-600/30 hover:shadow-brand-500/50 transition-all flex items-center justify-center gap-2">
            <span>تسجيل الدخول</span>
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
          </button>

          <button type="button" id="btn-forgot-password" class="w-full text-center text-xs text-slate-400 hover:text-brand-300 transition-colors mt-1">
            نسيت كلمة السر؟
          </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500 border-t border-slate-800/80 pt-4">
          <span>الحسابات والإنشاء محصورة بمدير النظام فقط لضمان الأمان الكامل</span>
        </div>
      </div>
    </div>

    <!-- Main Navigation Bar -->
    <header id="main-header" class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 px-4 lg:px-8 py-3 flex items-center justify-between shadow-lg">
      <div class="flex items-center gap-3">
        <!-- Mobile Drawer Hamburger Button -->
        <button id="btn-mobile-menu-toggle" class="md:hidden p-2 bg-slate-800 border border-slate-700 text-slate-300 hover:text-white rounded-xl transition-all">
          <i data-lucide="menu" class="w-6 h-6"></i>
        </button>

        <!-- Brand Title & Home Link -->
        <a href="index.html" class="flex items-center gap-3 cursor-pointer group" data-nav="dashboard" title="الرجوع للشاشة الرئيسية">
          <div class="w-11 h-11 rounded-xl overflow-hidden bg-slate-800 border border-brand-500/30 flex items-center justify-center shadow-md shadow-brand-500/20 group-hover:scale-105 transition-all">
            <img src="2.jpg" alt="علاء الدين 🪄" class="w-full h-full object-contain">
          </div>
          <div>
            <h2 class="text-lg font-bold text-white leading-tight group-hover:text-brand-300 transition-all">علاء الدين 🪄</h2>
            <p class="text-xs text-brand-400 font-medium">للبطاطين والمفروشات</p>
          </div>
        </a>
      </div>

      <!-- Navigation Links for Desktop -->
      <nav class="hidden md:flex items-center gap-1 bg-slate-800/60 p-1.5 rounded-xl border border-slate-800">
        <button data-nav="dashboard" class="nav-btn px-4 py-2 rounded-lg text-sm font-semibold transition-all text-white bg-brand-600 shadow-sm flex items-center gap-2">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
          <span>الرئيسية</span>
        </button>
        <button data-nav="orders" class="nav-btn px-4 py-2 rounded-lg text-sm font-semibold transition-all text-slate-300 hover:text-white hover:bg-slate-700/50 flex items-center gap-2">
          <i data-lucide="shopping-bag" class="w-4 h-4 text-emerald-400"></i>
          <span>سجل الطلبات</span>
        </button>
        <button data-nav="customers" class="nav-btn px-4 py-2 rounded-lg text-sm font-semibold transition-all text-slate-300 hover:text-white hover:bg-slate-700/50 flex items-center gap-2">
          <i data-lucide="users" class="w-4 h-4"></i>
          <span>العملاء</span>
        </button>
        <button data-nav="suppliers" class="nav-btn px-4 py-2 rounded-lg text-sm font-semibold transition-all text-slate-300 hover:text-white hover:bg-slate-700/50 flex items-center gap-2">
          <i data-lucide="truck" class="w-4 h-4"></i>
          <span>الموردين</span>
        </button>
        <button data-nav="products" class="nav-btn px-4 py-2 rounded-lg text-sm font-semibold transition-all text-slate-300 hover:text-white hover:bg-slate-700/50 flex items-center gap-2">
          <i data-lucide="boxes" class="w-4 h-4"></i>
          <span>المنتجات</span>
        </button>
        <button data-nav="payments" class="nav-btn px-4 py-2 rounded-lg text-sm font-semibold transition-all text-slate-300 hover:text-white hover:bg-slate-700/50 flex items-center gap-2">
          <i data-lucide="wallet" class="w-4 h-4"></i>
          <span>المدفوعات</span>
        </button>
        <button data-nav="reports" class="nav-btn px-4 py-2 rounded-lg text-sm font-semibold transition-all text-slate-300 hover:text-white hover:bg-slate-700/50 flex items-center gap-2">
          <i data-lucide="bar-chart-3" class="w-4 h-4"></i>
          <span>التقارير</span>
        </button>
        <button data-nav="users" id="nav-btn-users" class="nav-btn px-4 py-2 rounded-lg text-sm font-semibold transition-all text-slate-300 hover:text-white hover:bg-slate-700/50 flex items-center gap-2">
          <i data-lucide="user-cog" class="w-4 h-4 text-brand-400"></i>
          <span>الموظفين</span>
        </button>
      </nav>

      <!-- User Profile & Quick Actions -->
      <div class="flex items-center gap-3">
        <button id="btn-quick-new-order" onclick="window.openNewOrderModal()" class="px-4 py-2 bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white text-sm font-bold rounded-xl shadow-md shadow-emerald-600/20 transition-all flex items-center gap-2">
          <i data-lucide="plus-circle" class="w-4 h-4"></i>
          <span class="hidden sm:inline">طلب جديد</span>
        </button>

        <div class="h-6 w-px bg-slate-800"></div>

        <!-- Click-Activated User Profile Dropdown -->
        <div class="relative">
          <button id="user-menu-btn" class="flex items-center gap-2 px-3 py-1.5 bg-slate-800/80 hover:bg-slate-800 rounded-xl border border-slate-700 text-slate-200 text-sm font-medium transition-all cursor-pointer whitespace-nowrap">
            <div class="w-9 h-9 min-w-[36px] min-h-[36px] rounded-full flex items-center justify-center shrink-0 bg-blue-900/40 border border-blue-500/30">
              <svg class="w-5 h-5 text-blue-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </div>
            <div class="flex flex-col items-start justify-center leading-tight gap-0.5 min-w-0">
              <span id="user-display-name" class="hidden sm:block max-w-[130px] truncate whitespace-nowrap font-bold text-slate-100 leading-tight">المدير العام</span>
              <span id="user-role-badge" class="px-1.5 py-0.5 text-[10px] font-bold whitespace-nowrap bg-brand-500/20 text-brand-300 rounded border border-brand-500/30 leading-tight">مدير</span>
            </div>
            <i data-lucide="chevron-down" class="w-4 h-4 shrink-0 text-slate-400"></i>
          </button>
          
          <!-- Click-Activated Dropdown menu -->
          <div id="user-dropdown-menu" class="absolute left-0 mt-2 w-48 bg-slate-900 border border-slate-800 rounded-xl shadow-2xl py-1 hidden transition-all z-50">
            <button data-nav="users" class="admin-only w-full px-4 py-2.5 text-right text-sm text-slate-300 hover:bg-slate-800 hover:text-white flex items-center gap-2">
              <i data-lucide="user-cog" class="w-4 h-4 text-brand-400"></i>
              <span>إدارة الموظفين</span>
            </button>
            <button data-nav="settings" class="w-full px-4 py-2.5 text-right text-sm text-slate-300 hover:bg-slate-800 hover:text-white flex items-center gap-2">
              <i data-lucide="settings" class="w-4 h-4 text-slate-400"></i>
              <span>الإعدادات</span>
            </button>
            <button id="btn-change-password" class="w-full px-4 py-2.5 text-right text-sm text-slate-300 hover:bg-slate-800 hover:text-white flex items-center gap-2">
              <i data-lucide="key" class="w-4 h-4 text-amber-400"></i>
              <span>تغيير كلمة السر</span>
            </button>
            <div class="my-1 border-t border-slate-800"></div>
            <button id="btn-logout" class="w-full px-4 py-2.5 text-right text-sm text-rose-400 hover:bg-rose-950/40 flex items-center gap-2">
              <i data-lucide="log-out" class="w-4 h-4 text-rose-400"></i>
              <span>تسجيل الخروج</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Mobile Drawer Overlay Menu -->
    <div id="mobile-drawer" class="fixed inset-0 z-40 bg-slate-950/90 backdrop-blur-md hidden md:hidden flex flex-col justify-between p-6 animate-fadeIn">
      <div class="space-y-6">
        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
          <a href="index.html" class="flex items-center gap-3 cursor-pointer" data-nav="dashboard">
            <div class="w-10 h-10 rounded-xl overflow-hidden bg-slate-800 border border-brand-500/30 flex items-center justify-center">
              <img src="2.jpg" alt="علاء الدين 🪄" class="w-full h-full object-contain">
            </div>
            <div>
              <h3 class="font-bold text-white text-base">علاء الدين 🪄</h3>
              <p class="text-xs text-brand-400">للبطاطين والمفروشات</p>
            </div>
          </a>
          <button id="btn-close-mobile-drawer" class="p-2 text-slate-400 hover:text-white bg-slate-800 rounded-xl">
            <i data-lucide="x" class="w-6 h-6"></i>
          </button>
        </div>
        
        <nav class="flex flex-col gap-2.5">
          <button data-nav="dashboard" class="mobile-nav-btn w-full p-3.5 rounded-xl bg-slate-800/90 text-white font-bold text-right flex items-center gap-3 border border-slate-700">
            <i data-lucide="layout-dashboard" class="w-5 h-5 text-brand-400"></i>
            <span>الرئيسية (لوحة التحكم)</span>
          </button>
          <button data-nav="orders" class="mobile-nav-btn w-full p-3.5 rounded-xl hover:bg-slate-800 text-slate-200 font-bold text-right flex items-center gap-3 border border-slate-800">
            <i data-lucide="shopping-bag" class="w-5 h-5 text-emerald-400"></i>
            <span>سجل الطلبات والفواتير</span>
          </button>
          <button data-nav="customers" class="mobile-nav-btn w-full p-3.5 rounded-xl hover:bg-slate-800 text-slate-200 font-bold text-right flex items-center gap-3 border border-slate-800">
            <i data-lucide="users" class="w-5 h-5 text-sky-400"></i>
            <span>دليل العملاء والحسابات</span>
          </button>
          <button data-nav="suppliers" class="mobile-nav-btn w-full p-3.5 rounded-xl hover:bg-slate-800 text-slate-200 font-bold text-right flex items-center gap-3 border border-slate-800">
            <i data-lucide="truck" class="w-5 h-5 text-purple-400"></i>
            <span>الموردين والمصانع</span>
          </button>
          <button data-nav="products" class="mobile-nav-btn w-full p-3.5 rounded-xl hover:bg-slate-800 text-slate-200 font-bold text-right flex items-center gap-3 border border-slate-800">
            <i data-lucide="boxes" class="w-5 h-5 text-amber-400"></i>
            <span>المنتجات والمخزون</span>
          </button>
          <button data-nav="payments" class="mobile-nav-btn w-full p-3.5 rounded-xl hover:bg-slate-800 text-slate-200 font-bold text-right flex items-center gap-3 border border-slate-800">
            <i data-lucide="wallet" class="w-5 h-5 text-emerald-400"></i>
            <span>المدفوعات والتحصيلات</span>
          </button>
          <button data-nav="reports" class="mobile-nav-btn w-full p-3.5 rounded-xl hover:bg-slate-800 text-slate-200 font-bold text-right flex items-center gap-3 border border-slate-800">
            <i data-lucide="bar-chart-3" class="w-5 h-5 text-teal-400"></i>
            <span>التقارير المالية والديون</span>
          </button>
          <button data-nav="users" id="mobile-nav-btn-users" class="mobile-nav-btn w-full p-3.5 rounded-xl hover:bg-slate-800 text-slate-200 font-bold text-right flex items-center gap-3 border border-slate-800">
            <i data-lucide="user-cog" class="w-5 h-5 text-brand-400"></i>
            <span>إدارة حسابات الموظفين</span>
          </button>
        </nav>
      </div>

      <div class="border-t border-slate-800 pt-4 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-brand-600/30 border border-brand-500/40 text-brand-300 flex items-center justify-center font-bold text-xs">
            <span>مدير</span>
          </div>
          <div>
            <p class="text-xs font-bold text-white">المدير العام</p>
            <p class="text-[10px] text-slate-400">حساب الإدارة الرئيسية</p>
          </div>
        </div>

        <button id="mobile-btn-logout" class="p-2 text-rose-400 hover:bg-rose-950/50 rounded-xl transition-all" title="تسجيل الخروج">
          <i data-lucide="log-out" class="w-5 h-5"></i>
        </button>
      </div>
    </div>

    <!-- Dynamic View Main Content Area -->
    <main id="main-content" class="flex-1 max-w-7xl w-full mx-auto p-4 lg:p-8">
      <!-- Views injected here dynamically by BMSApp -->
    </main>

    <!-- Modal Dialog System Container -->
    <div id="modal-container" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm hidden"></div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="fixed bottom-6 left-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Footer -->
    <footer class="mt-auto border-t border-slate-800/80 bg-slate-950/60 py-4 text-center text-xs text-slate-500">
      <span>علاء الدين 🪄 نظام الإدارة اليومية الذكي — جميع الحقوق محفوظة &copy; 2026</span>
    </footer>

  </div>

  <script src="js/utils/formatters.js?v=3.6"></script>

  <script src="js/services/orders.js?v=3.6"></script>

  <script src="js/components/products-view.js?v=3.6"></script>
  <script src="js/components/payments-view.js?v=3.6"></script>
  <script src="js/components/reports-view.js?v=3.6"></script>
  <script src="js/components/users-view.js?v=3.6"></script>
